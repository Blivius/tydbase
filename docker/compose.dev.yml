# Hot-reload development, layered on compose.yml (velaops pattern: dev image stage + bind-mounted
# source + an in-container watcher):
#   docker compose -f docker/compose.yml -f docker/compose.dev.yml up -d --build
#
#   Engine:  http://localhost:8080  air rebuilds + restarts on any engine/**/*.go save (~1-2s)
#   Site:    http://localhost:3000  next dev; edits under apps/site/src and packages/*/src apply live
#
# Only source directories are mounted; dependencies stay in the image. After changing a
# package.json, bun.lock, next.config.ts or go.mod, rebuild: add --build to the command above.
#
# Target databases are a separate stack (compose.dbs.yml): use host.docker.internal:<port>.

services:
  engine:
    build:
      target: dev
    image: tydbase/engine:dev
    command: ["air", "-c", ".air.toml"]
    environment:
      TYDBASE_ENV: development
    read_only: false
    cap_drop: !reset []
    volumes:
      - ../engine:/src/engine
      # Own data volume: the dev container runs as root, so its master.key and tydbase.db would be
      # unreadable to the nonroot production image if they shared tydbase-data.
      - tydbase-data-dev:/data
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/src/engine/tmp/tydbase", "healthcheck"]
      interval: 10s
      start_period: 90s
      retries: 6

  site:
    profiles: !reset []
    build:
      target: dev
    image: tydbase/site:dev
    environment:
      NODE_ENV: development
    volumes:
      - ../apps/site/src:/app/apps/site/src
      - ../apps/site/public:/app/apps/site/public
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/wasm-playground/src:/app/packages/wasm-playground/src
      - site-next:/app/apps/site/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      start_period: 120s
      retries: 6

volumes:
  tydbase-data-dev:
    name: tydbase-data-dev
  go-mod:
  go-build:
  site-next:
