version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - bodyclose
    - gosec
    - misspell
    - errorlint
    - nilerr
    - copyloopvar
    - usestdlibvars
  settings:
    errcheck:
      # Writing CLI output to stdout/stderr: a failed write has nowhere to be reported.
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/blivius/tydbase
