services:
  site:
    build:
      context: ../..
      dockerfile: deploy/docker/site.Dockerfile
    image: tydbase-site:local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_AUDIENCE_ID=${RESEND_AUDIENCE_ID:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - RESEND_NOTIFY_EMAIL=${RESEND_NOTIFY_EMAIL:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://tydbase.blivius.com}
    restart: unless-stopped
