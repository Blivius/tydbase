# Production builds. Two uses:
#   Self-host the engine:              docker compose -f docker/compose.yml up -d --build
#   Production check before handover:  docker compose -f docker/compose.yml --profile site up -d --build
# Hot-reload development layers compose.dev.yml on top (see that file).

name: tydbase

services:
  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${TYDBASE_VERSION:-0.1.0}
    image: tydbase/engine:${TYDBASE_VERSION:-local}
    container_name: tydbase-engine
    command: ["server", "--modules=${TYDBASE_MODULES:-all}"]
    environment:
      TYDBASE_ENV: ${TYDBASE_ENV:-production}
      TYDBASE_CORS_ORIGIN: ${TYDBASE_CORS_ORIGIN:-http://localhost:3000}
      TYDBASE_MASTER_KEY: ${TYDBASE_MASTER_KEY:-}
    ports:
      - "${TYDBASE_PORT:-8080}:8080"
    # tydbase.db + master.key (auto-generated on first boot unless TYDBASE_MASTER_KEY is set).
    volumes:
      - tydbase-data:/data
    networks: [tydbase]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # The marketing site's real production is Vercel. This standalone build is the local check.
  site:
    profiles: ["site"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.site
    image: tydbase/site:local
    container_name: tydbase-site
    env_file:
      - path: ../apps/site/.env
        required: false
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks: [tydbase]
    restart: unless-stopped

volumes:
  tydbase-data:
    name: tydbase-data

networks:
  tydbase:
    name: tydbase-net
