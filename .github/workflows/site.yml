name: Site

# The landing page (`apps/site`) on Vercel, deployed only when someone runs this workflow (Actions →
# Site → Run workflow, or `gh workflow run site.yml -R blivius/tydbase`). Nothing deploys on a push:
# Vercel's Git integration is switched off in `apps/site/vercel.json`. The Vercel project's Root
# Directory is `apps/site`; `.vercelignore` keeps the engine and docs out of the upload.
#
#   target: production   → tydbase.blivius.com
#   target: preview      → a preview URL, written to the job summary

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

# One deploy per target at a time; a newer run waits for the one in progress.
concurrency:
  group: site-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Not secrets: they name the project, and the token is what grants access to it. The team is
      # the Blivius team that also owns Dispach's site; the project is tydbase-landing-page.
      VERCEL_ORG_ID: team_kF5gAInfg7ld7OI1wUPIFLCa
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Vercel settings are present
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing secret VERCEL_TOKEN,"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing variable VERCEL_PROJECT_ID,"
          if [ -n "$missing" ]; then
            echo "::error::Missing${missing%,}. Nothing was deployed. Set them under Settings → Secrets and variables → Actions (gh secret set / gh variable set) and re-run this job."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          prod=""
          if [ "$TARGET" = production ]; then prod=--prod; fi
          url=$(bunx vercel@65.12.1 deploy $prod --yes --token "$VERCEL_TOKEN")
          echo "deployed: $url"
          echo "$TARGET deployment: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          TARGET: ${{ inputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
