# Disposable multi-paradigm development databases for local TydBase driver testing.
# Start core stack:  docker compose -f deploy/compose/dev-dbs.yml up -d
# Include MSSQL:     docker compose -f deploy/compose/dev-dbs.yml --profile mssql up -d
# Stop & clean:      docker compose -f deploy/compose/dev-dbs.yml down -v

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tydbase-dev-postgres
    environment:
      POSTGRES_USER: tydbase
      POSTGRES_PASSWORD: tydbase_dev_password
      POSTGRES_DB: tydbase_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tydbase -d tydbase_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: tydbase-dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: tydbase_dev_password
      MYSQL_DATABASE: tydbase_dev
      MYSQL_USER: tydbase
      MYSQL_PASSWORD: tydbase_dev_password
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptydbase_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:11.4
    container_name: tydbase-dev-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: tydbase_dev_password
      MARIADB_DATABASE: tydbase_dev
      MARIADB_USER: tydbase
      MARIADB_PASSWORD: tydbase_dev_password
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    container_name: tydbase-dev-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: tydbase
      MONGO_INITDB_ROOT_PASSWORD: tydbase_dev_password
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tydbase-dev-redis
    command: ["redis-server", "--requirepass", "tydbase_dev_password"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tydbase_dev_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tydbase-dev-mssql
    profiles: ["mssql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TydbaseDevPassword1!"
    ports:
      - "1434:1433"
