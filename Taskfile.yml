version: "3"

tasks:
  install:
    desc: Install JS/TS workspace dependencies with Bun and Go engine modules
    cmds:
      - bun install
      - cd engine && go mod download

  dev:
    desc: Start all workspace dev servers via Turborepo
    cmds:
      - bun run dev

  dev:site:
    desc: Start the TydBase landing page & waitlist app
    cmds:
      - bun run --filter @tydbase/site dev

  dev:engine:
    desc: Run the TydBase engine server locally
    dir: engine
    cmds:
      - go run ./cmd/tydbase server

  openapi:
    desc: Export Go Huma v2 OpenAPI 3.1 spec to engine/openapi.json
    dir: engine
    cmds:
      - go run ./cmd/tydbase openapi --out ./openapi.json

  sdk:gen:
    desc: Regenerate @tydbase/sdk TypeScript schema from Go OpenAPI 3.1
    deps: [openapi]
    cmds:
      - bun run sdk:gen

  lint:
    desc: Run type-aware oxlint on JS/TS and golangci-lint on the engine
    cmds:
      - bun run lint
      - cd engine && golangci-lint run ./...

  fmt:
    desc: Format workspace code with oxfmt and the engine with gofmt + goimports
    cmds:
      - bun run fmt
      - cd engine && golangci-lint fmt ./...

  fmt:check:
    desc: Check formatting with oxfmt and gofmt
    cmds:
      - bun run fmt:check
      - cd engine && test -z "$(gofmt -l .)"

  typecheck:
    desc: Run TypeScript type checks across all packages
    cmds:
      - bun run typecheck

  build:
    desc: Build all workspace apps, packages, and Go CLI binary
    cmds:
      - bun run build
      - cd engine && go build -trimpath -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o ./bin/tydbase ./cmd/tydbase

  test:
    desc: Run automated Bun and Go test suites
    cmds:
      - bun run test
      - cd engine && go test -race -count=1 ./...
      - cd engine && go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  up:
    desc: Hot-reload dev stack, detached (engine via air on :8080, site via next dev on :3000)
    cmds:
      - docker compose -f docker/compose.yml -f docker/compose.dev.yml up -d --build

  up:prod:
    desc: Production builds, detached (distroless engine + standalone site), the pre-handover check
    cmds:
      - docker compose -f docker/compose.yml --profile site up -d --build

  logs:
    desc: Follow engine and site logs
    cmds:
      - docker compose -f docker/compose.yml -f docker/compose.dev.yml logs -f engine site

  down:
    desc: Stop the engine and site (dev or prod)
    cmds:
      - docker compose -f docker/compose.yml -f docker/compose.dev.yml --profile site down

  dbs:
    desc: Start the seeded target databases (add MSSQL with `task dbs -- --profile mssql`)
    cmds:
      - docker compose -f docker/compose.dbs.yml {{.CLI_ARGS}} up -d

  dbs:down:
    desc: Stop and wipe the target databases (seeds re-run on next start)
    cmds:
      - docker compose -f docker/compose.dbs.yml --profile mssql down -v

  check:
    desc: Run lint, formatting check, typecheck, tests, and build
    cmds:
      - task: lint
      - task: fmt:check
      - task: typecheck
      - task: test
      - task: build
