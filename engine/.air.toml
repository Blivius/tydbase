# air hot reload for the engine (docker/compose.dev.yml runs this inside the `dev` image stage).
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/tydbase ./cmd/tydbase"
entrypoint = ["./tmp/tydbase", "server"]
include_ext = ["go"]
exclude_dir = ["tmp", "bin"]
exclude_regex = ["_test\\.go$"]
delay = 300
kill_delay = "2s"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
